<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05060f">
<title>霓虹疾驰 · Neon Dash</title>
<style>
  :root { --cyan:#29ffe3; --pink:#ff2d78; --gold:#ffd54a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060f;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  canvas { display:block; }

  #hud { position:fixed; top:14px; left:0; right:0; display:flex;
    justify-content:space-between; padding:0 22px; pointer-events:none; z-index:5; }
  .hud-box { color:#dffcf6; text-shadow:0 0 12px rgba(41,255,227,.45); }
  .hud-label { font-size:11px; letter-spacing:3px; color:#6fa8b8; margin-bottom:2px; }
  #scoreVal { font-size:34px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1; }
  #bestVal  { font-size:13px; color:#79d2c4; margin-top:4px; letter-spacing:1px; }
  #coinBox  { text-align:right; }
  #coinVal  { font-size:26px; font-weight:700; color:var(--gold);
    text-shadow:0 0 14px rgba(255,213,74,.5); font-variant-numeric:tabular-nums; }

  #overlay { position:fixed; inset:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center; z-index:10;
    background:radial-gradient(ellipse at center, rgba(5,8,20,.38) 0%, rgba(3,4,12,.82) 100%);
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);
    transition:opacity .28s ease; }
  #overlay.hidden { opacity:0; pointer-events:none; }
  #title { font-size:min(11vw,64px); font-weight:800; letter-spacing:10px; color:#eafffb;
    text-shadow:0 0 18px rgba(41,255,227,.65), 0 0 48px rgba(41,255,227,.3),
                0 0 90px rgba(255,45,120,.25); margin-bottom:14px; text-align:center; }
  #msg { color:#9fd8cd; font-size:15px; letter-spacing:2px; margin-bottom:36px; text-align:center;
    line-height:1.9; padding:0 24px; }
  #startBtn { pointer-events:auto; cursor:pointer; background:rgba(41,255,227,.06);
    color:var(--cyan); border:1px solid rgba(41,255,227,.75); border-radius:999px;
    padding:13px 52px; font-size:17px; letter-spacing:6px; font-weight:600;
    text-shadow:0 0 10px rgba(41,255,227,.6); box-shadow:0 0 22px rgba(41,255,227,.22),
    inset 0 0 14px rgba(41,255,227,.08); transition:all .18s ease; }
  #startBtn:hover { background:rgba(41,255,227,.16); box-shadow:0 0 34px rgba(41,255,227,.45),
    inset 0 0 20px rgba(41,255,227,.15); transform:translateY(-1px); }
  #hint { position:fixed; bottom:14px; left:0; right:0; text-align:center;
    color:#4d7280; font-size:12px; letter-spacing:2px; z-index:4; pointer-events:none; }
  #boostTag { position:fixed; top:18px; left:50%;
    transform:translateX(-50%) translateY(-8px);
    color:var(--gold); font-size:15px; font-weight:700; letter-spacing:6px;
    text-shadow:0 0 14px rgba(255,213,74,.65); opacity:0;
    transition:opacity .15s ease, transform .15s ease; z-index:6; pointer-events:none; }
  #boostTag.on { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">SCORE 分数</div>
    <div id="scoreVal">0</div>
    <div id="bestVal">最佳 0</div>
  </div>
  <div class="hud-box" id="coinBox">
    <div class="hud-label">COINS 金币</div>
    <div id="coinVal">◆ 0</div>
  </div>
</div>

<div id="boostTag">»» 加速中 ««</div>

<div id="overlay">
  <div id="title">霓虹疾驰</div>
  <div id="msg">← → 或 A / D 换道躲避 · 按住 W 冲刺<br>吃金币 · 别撞上红色方块</div>
  <button id="startBtn">开始游戏</button>
</div>
<div id="hint">按住 W 冲刺 · 空格 开始 / 重开 · 手机左右滑动 · M 音乐开关</div>

<script src="lib/three.min.js"></script>
<script>window.THREE||document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>');</script>
<script>
'use strict';
(function () {
  /* ---------- 基础常量 ---------- */
  var LANE_W   = 2.3;          // 车道宽度
  var LANES    = [-2,-1,0,1,2];// 五条车道
  var SPAWN_Z  = -95;          // 生成深度（雾外）
  var KILL_Z   = 15;           // 回收深度
  var BASE_SPD = 13, MAX_SPD = 32;
  var BOOST_SPD = 10, FOV_N = 70, FOV_B = 79; // 冲刺附加速度与视场角

  /* ---------- DOM ---------- */
  var $score = document.getElementById('scoreVal');
  var $coin  = document.getElementById('coinVal');
  var $best  = document.getElementById('bestVal');
  var $over  = document.getElementById('overlay');
  var $title = document.getElementById('title');
  var $msg   = document.getElementById('msg');
  var $btn   = document.getElementById('startBtn');
  var $boost = document.getElementById('boostTag');

  /* ---------- 渲染器 / 场景 ---------- */
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias:true });
  } catch (e) {
    $msg.innerHTML = '当前浏览器不支持 WebGL，无法运行 :(';
    $btn.style.display = 'none';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05060f);
  scene.fog = new THREE.Fog(0x05060f, 16, 52);

  var camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 220);

  /* ---------- 灯光 ---------- */
  scene.add(new THREE.AmbientLight(0x8899bb, 0.7));
  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(6, 12, 4);
  scene.add(sun);

  /* ---------- 地面与赛道 ---------- */
  var floor = new THREE.Mesh(
    new THREE.PlaneGeometry(46, 420),
    new THREE.MeshBasicMaterial({ color:0x06091c })
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.set(0, -0.06, -150);
  scene.add(floor);

  // 纵向车道分隔线（静止）：6 条内边界，位于 ±1.15 / ±3.45 / ±5.75
  (function () {
    var verts = [];
    [-2.5,-1.5,-0.5,0.5,1.5,2.5].forEach(function (k) {
      var x = k * LANE_W;
      verts.push(x, 0.01, -300,  x, 0.01, 30);
    });
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    scene.add(new THREE.LineSegments(g,
      new THREE.LineBasicMaterial({ color:0x14435f, transparent:true, opacity:0.85 })));
  })();

  // 横向刻度线（滚动，模 4 循环）
  var crossLines = (function () {
    var verts = [], STEP = 4, LEN = 320, N = LEN / STEP;
    for (var i = 0; i <= N; i++) {
      var z = 30 - i * STEP;
      verts.push(-7.2, 0.01, z,  7.2, 0.01, z);
    }
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    var m = new THREE.LineSegments(g,
      new THREE.LineBasicMaterial({ color:0x123c58, transparent:true, opacity:0.9 }));
    scene.add(m);
    return m;
  })();

  // 两侧霓虹护栏
  function rail(x, color) {
    var m = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.42, 360),
      new THREE.MeshBasicMaterial({ color:color })
    );
    m.position.set(x, 0.21, -145);
    scene.add(m);
  }
  rail(-6.1, 0x29ffe3); rail(6.1, 0x29ffe3);
  rail(-8.3, 0x7e1c46); rail(8.3, 0x7e1c46);

  /* ---------- 星尘粒子 ---------- */
  var STARS_N = 350;
  var starPos = new Float32Array(STARS_N * 3);
  for (var si = 0; si < STARS_N; si++) {
    starPos[si*3]   = (Math.random()-0.5) * 90;
    starPos[si*3+1] = Math.random() * 30 + 0.5;
    starPos[si*3+2] = Math.random() * 148 - 130;
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({
    color:0x7fb8ff, size:0.32, transparent:true, opacity:0.75, sizeAttenuation:true
  }));
  scene.add(stars);

  /* ---------- 玩家 ---------- */
  var playerMat = new THREE.MeshStandardMaterial({
    color:0x062b2c, emissive:0x17e9c5, emissiveIntensity:0.9, metalness:0.35, roughness:0.35
  });
  var player = new THREE.Group();
  var bodyGeo = new THREE.BoxGeometry(1.25, 1.25, 1.25);
  var bodyMesh = new THREE.Mesh(bodyGeo, playerMat);
  bodyMesh.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(bodyGeo),
    new THREE.LineBasicMaterial({ color:0xc8ffff })
  ));
  player.add(bodyMesh);
  var pLight = new THREE.PointLight(0x29ffe3, 1.1, 15);
  pLight.position.y = 1.4;
  player.add(pLight);
  player.position.set(0, 1.0, 0);
  scene.add(player);

  var shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.8, 26),
    new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.3 })
  );
  shadow.rotation.x = -Math.PI/2;
  shadow.position.y = 0.02;
  scene.add(shadow);

  /* ---------- 对象池：障碍 / 金币 / 拾取光环 ---------- */
  var obsGeo  = new THREE.BoxGeometry(1.9, 1, 1.9);
  var obsEdge = new THREE.EdgesGeometry(obsGeo);
  var obsMat  = new THREE.MeshStandardMaterial({
    color:0x3a0714, emissive:0xff2451, emissiveIntensity:0.75, metalness:0.2, roughness:0.5
  });
  var edgeMat = new THREE.LineBasicMaterial({ color:0xff9ab5 });

  var coinGeo  = new THREE.OctahedronGeometry(0.42);
  var coinMat  = new THREE.MeshStandardMaterial({
    color:0x8a5b00, emissive:0xffc63a, emissiveIntensity:0.95, metalness:0.6, roughness:0.3
  });

  var obsPool = [], obsActive = [];
  var coinPool = [], coinActive = [];

  function getObs() {
    var m = obsPool.pop();
    if (!m) {
      m = new THREE.Mesh(obsGeo, obsMat);
      m.add(new THREE.LineSegments(obsEdge, edgeMat));
    }
    scene.add(m);
    obsActive.push(m);
    return m;
  }
  function getCoin() {
    var m = coinPool.pop();
    if (!m) {
      m = new THREE.Mesh(coinGeo, coinMat);
      m.userData.phase = Math.random() * Math.PI * 2;
    }
    scene.add(m);
    coinActive.push(m);
    return m;
  }

  var RINGS_N = 8, rings = [], ringIdx = 0;
  var ringGeo = new THREE.TorusGeometry(0.55, 0.055, 10, 30);
  for (var ri = 0; ri < RINGS_N; ri++) {
    var rm = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({
      color:0xffd54a, transparent:true, opacity:0
    }));
    rm.visible = false;
    scene.add(rm);
    rings.push({ mesh:rm, life:-1 });
  }
  function popRing(x, y, z) {
    var r = rings[ringIdx++ % RINGS_N];
    r.life = 0;
    r.mesh.visible = true;
    r.mesh.position.set(x, y, z);
    r.mesh.scale.set(1,1,1);
    r.mesh.material.opacity = 1;
  }

  /* ---------- 音效与背景音乐（WebAudio 程序化合成，无外部资源） ---------- */
  var actx = null;
  var master = null, musicBus = null, arpBus = null, noiseBuf = null;
  var windSrc = null, windFilter = null, windGain = null, windLvl = 0;
  var musicOn = true, musicEnergy = 0;
  var BPM = 126, SPB = 60 / BPM;
  var mStep = 0, mNextT = 0, schedTimer = null;

  function initAudio() {
    if (!actx) {
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (!actx) return;
    setupMusicGraph();
    if (actx.state === 'suspended') actx.resume();
    startMusic();
  }

  function setupMusicGraph() {
    if (master) return;
    master = actx.createDynamicsCompressor();
    master.threshold.value = -18; master.knee.value = 22; master.ratio.value = 6;
    master.connect(actx.destination);

    musicBus = actx.createGain();
    musicBus.gain.value = musicOn ? 0.5 : 0.0001;
    musicBus.connect(master);

    // 琶音通道 + 附点八分回声
    arpBus = actx.createGain();
    arpBus.connect(musicBus);
    var dl = actx.createDelay(1); dl.delayTime.value = SPB * 0.75;
    var fb = actx.createGain(); fb.gain.value = 0.32;
    var wet = actx.createGain(); wet.gain.value = 0.45;
    arpBus.connect(dl); dl.connect(fb); fb.connect(dl);
    dl.connect(wet); wet.connect(musicBus);

    // 白噪声源（军鼓/踩镲用）
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var n = 0; n < d.length; n++) d[n] = Math.random() * 2 - 1;

    // 冲刺风声引擎：循环噪声 + 低通，平时静音
    windSrc = actx.createBufferSource();
    windSrc.buffer = noiseBuf;
    windSrc.loop = true;
    windFilter = actx.createBiquadFilter();
    windFilter.type = 'lowpass';
    windFilter.frequency.value = 320;
    windFilter.Q.value = 0.7;
    windGain = actx.createGain();
    windGain.gain.value = 0;
    windSrc.connect(windFilter); windFilter.connect(windGain);
    windGain.connect(master);          // 走 SFX 总线，M 键静音音乐不影响它
    windSrc.start();
  }

  /* --- 合成器声部 --- */
  function kick(t) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.55, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.25);
  }
  function hat(t) {
    var src = actx.createBufferSource(); src.buffer = noiseBuf;
    var f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7500;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.035 * (1 + musicEnergy * 1.1), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
    src.connect(f); f.connect(g); g.connect(musicBus);
    src.start(t); src.stop(t + 0.07);
  }
  function snare(t) {
    var src = actx.createBufferSource(); src.buffer = noiseBuf;
    var f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 0.8;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.16 * (1 + musicEnergy * 0.5), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.connect(f); f.connect(g); g.connect(musicBus);
    src.start(t); src.stop(t + 0.18);
  }
  function bass(freq, t, vol) {
    var o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
    o.type = 'sawtooth'; o.frequency.value = freq;
    f.type = 'lowpass'; f.frequency.value = 480 + musicEnergy * 700; f.Q.value = 4;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    o.connect(f); f.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + 0.25);
  }
  function arp(freq, t) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.055 * (1 + musicEnergy * 0.9), t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    o.connect(g); g.connect(arpBus);
    o.start(t); o.stop(t + 0.16);
  }

  /* --- 音序器：Am → F → C → G，四小节无限循环 --- */
  var PROG = [
    { root:110.00, triad:[220.00,261.63,329.63] },
    { root: 87.31, triad:[174.61,220.00,261.63] },
    { root:130.81, triad:[261.63,329.63,392.00] },
    { root: 98.00, triad:[196.00,246.94,293.66] }
  ];
  function scheduleStep(s, t) {
    var ch = PROG[Math.floor(s / 16) % PROG.length];
    var st = s % 16;
    if (st % 4 === 0) kick(t);                    // 四踩底鼓
    if (st === 4 || st === 12) snare(t);          // 2、4 拍军鼓
    if (st % 2 === 1) hat(t);                     // 反拍踩镲
    if (st % 2 === 0) bass(ch.root, t, st === 0 ? 0.22 : 0.15);
    var seq = [ch.triad[0], ch.triad[1], ch.triad[2], ch.triad[1]];
    arp(seq[st % 4] * 2, t);                      // 十六分琶音
  }
  function musicPump() {
    while (mNextT < actx.currentTime + 0.16) {
      scheduleStep(mStep, mNextT);
      mNextT += SPB / 4;
      mStep++;
    }
  }
  function startMusic() {
    if (!actx || !musicOn || schedTimer) return;
    mNextT = actx.currentTime + 0.08;
    schedTimer = setInterval(musicPump, 30);
  }
  function toggleMusic() {
    musicOn = !musicOn;
    if (!actx) return;
    var now = actx.currentTime;
    musicBus.gain.cancelScheduledValues(now);
    if (musicOn) {
      musicBus.gain.setTargetAtTime(0.5, now, 0.1);
      startMusic();
    } else {
      musicBus.gain.setTargetAtTime(0.0001, now, 0.07);
      clearInterval(schedTimer); schedTimer = null;
    }
  }

  /* --- 通用短音效 --- */
  function beep(freq, dur, type, vol, delay, slideTo) {
    if (!master) return;
    var t = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  var sfx = {
    coin : function(){ beep(988,.06,'square',.09,0); beep(1319,.11,'square',.09,.06); },
    crash: function(){ beep(240,.5,'sawtooth',.2,0,52); },
    go   : function(){ beep(523,.08,'triangle',.1,0); beep(784,.14,'triangle',.1,.08); },
    // 换道：左移下滑音、右移上滑音
    move : function(dir){
      if (dir > 0) beep(470,.06,'triangle',.12,0,640);
      else         beep(470,.06,'triangle',.12,0,330);
    }
  };

  // 标签页隐藏时挂起音频上下文（防止后台 interval 节流导致音乐卡顿）
  document.addEventListener('visibilitychange', function () {
    if (!actx) return;
    if (document.hidden) actx.suspend();
    else actx.resume();
  });

  /* ---------- 游戏状态 ---------- */
  var state = 'ready';           // ready | playing | over
  var speed = 6, elapsed = 0, distance = 0, coinsGot = 0;
  var score = 0, shownScore = -1;
  var best = 0;
  try { best = parseInt(localStorage.getItem('neondash_best') || '0', 10) || 0; } catch(e){}
  $best.textContent = '最佳 ' + best;

  var targetLane = 0;
  var runPhase = 0;
  var shake = 0, camX = 0;
  var distSinceSpawn = 0, nextGap = 18;
  var overVy = 0, overTimer = 0, overlayShown = false;

  function laneX(lane) { return lane * LANE_W; }

  /* ---------- 生成一排障碍 ---------- */
  function spawnRow() {
    var lanes = LANES.slice();
    // 打乱
    for (var i = lanes.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = lanes[i]; lanes[i] = lanes[j]; lanes[j] = tmp;
    }
    var p3 = Math.min(0.18, Math.max(0, (speed - 18) / 60)); // 高速时三连概率
    var r = Math.random(), nBlock;
    if (r < p3) nBlock = 3;
    else if (r < p3 + 0.58) nBlock = 2;
    else nBlock = 1;

    for (var b = 0; b < nBlock; b++) {
      var m = getObs();
      var h = 1.4 + Math.random() * 1.2;
      m.scale.set(1, h, 1);
      m.position.set(laneX(lanes[b]), h / 2, SPAWN_Z);
    }
    // 剩余空道里撒金币
    if (Math.random() < 0.55 && nBlock < 5) {
      var cl = lanes[nBlock];
      var n = 4;
      for (var c = 0; c < n; c++) {
        var cm = getCoin();
        cm.position.set(laneX(cl), 1.05, SPAWN_Z - c * 2.1);
      }
    }
  }

  function recycleAll() {
    var i;
    for (i = obsActive.length - 1; i >= 0; i--) {
      scene.remove(obsActive[i]); obsPool.push(obsActive[i]);
    }
    obsActive.length = 0;
    for (i = coinActive.length - 1; i >= 0; i--) {
      scene.remove(coinActive[i]); coinPool.push(coinActive[i]);
    }
    coinActive.length = 0;
    rings.forEach(function (r) { r.life = -1; r.mesh.visible = false; });
  }

  function resetGame() {
    recycleAll();
    speed = BASE_SPD; elapsed = 0; distance = 0; coinsGot = 0; score = 0;
    targetLane = 0; runPhase = 0; shake = 0;
    distSinceSpawn = 0; nextGap = 18;
    overVy = 0; overTimer = 0; overlayShown = false;
    player.position.set(0, 1.0, 0);
    player.rotation.set(0, 0, 0);
    playerMat.emissive.setHex(0x17e9c5);
    playerMat.emissiveIntensity = 0.9;
    state = 'playing';
    $over.classList.add('hidden');
    initAudio(); sfx.go();
  }

  function crash() {
    state = 'over';
    overVy = 7.5;
    shake = 0.7;
    sfx.crash();
    playerMat.emissive.setHex(0xff2244);
    playerMat.emissiveIntensity = 1.5;
    if (score > best) {
      best = score;
      try { localStorage.setItem('neondash_best', String(best)); } catch(e){}
      $best.textContent = '最佳 ' + best;
    }
  }

  function showOverOverlay() {
    $title.textContent = '撞毁了！';
    $msg.innerHTML = '本局得分 <b style="color:#29ffe3">' + score +
      '</b>　金币 ◆' + coinsGot + '<br>' + (score >= best && score > 0 ? '★ 新纪录！' : '最高纪录 ' + best);
    $btn.textContent = '再来一局';
    $over.classList.remove('hidden');
  }

  function showReadyOverlay() {
    $title.textContent = '霓虹疾驰';
    $msg.innerHTML = '← → 或 A / D 换道躲避 · 按住 W 冲刺<br>吃金币 · 别撞上红色方块';
    $btn.textContent = '开始游戏';
    $over.classList.remove('hidden');
  }

  /* ---------- 输入 ---------- */
  function moveLane(dir) {
    if (state !== 'playing') return;
    var nl = Math.max(-2, Math.min(2, targetLane + dir));
    if (nl === targetLane) return;      // 已在边缘车道：不移动也不响
    targetLane = nl;
    sfx.move(dir);
  }
  function primaryAction() {
    initAudio();
    if (state === 'ready') resetGame();
    else if (state === 'over' && overlayShown) resetGame();
  }

  var ptrDown = false, ptrX = 0;
  var keyBoost = false;

  window.addEventListener('keydown', function (ev) {
    var k = ev.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { moveLane(-1); ev.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { moveLane(1); ev.preventDefault(); }
    else if (k === 'w' || k === 'W' || k === 'ArrowUp') { keyBoost = true; ev.preventDefault(); }
    else if (k === 'm' || k === 'M') { initAudio(); toggleMusic(); ev.preventDefault(); }
    else if (k === ' ' || k === 'Spacebar' || k === 'Enter') { primaryAction(); ev.preventDefault(); }
  });
  window.addEventListener('keyup', function (ev) {
    if (ev.key === 'w' || ev.key === 'W' || ev.key === 'ArrowUp') keyBoost = false;
  });
  window.addEventListener('blur', function () { keyBoost = false; ptrDown = false; });
  renderer.domElement.addEventListener('pointerdown', function (ev) {
    ptrDown = true; ptrX = ev.clientX; initAudio();
    if (state !== 'playing') primaryAction();
  });
  window.addEventListener('pointermove', function (ev) {
    if (!ptrDown || state !== 'playing') return;
    var dx = ev.clientX - ptrX;
    if (dx > 34)       { moveLane(1);  ptrX = ev.clientX; }
    else if (dx < -34) { moveLane(-1); ptrX = ev.clientX; }
  });
  window.addEventListener('pointerup', function () { ptrDown = false; });

  $btn.addEventListener('click', function (ev) {
    ev.stopPropagation();
    initAudio();
    if (state === 'ready') resetGame();
    else if (state === 'over') resetGame();
  });

  window.addEventListener('resize', function () {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  /* ---------- 主循环 ---------- */
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;
    var i, m;

    if (state === 'playing') {
      elapsed += dt;
      var baseSpd = Math.min(MAX_SPD, BASE_SPD + elapsed * 0.5);
      var wantSpd = baseSpd + (keyBoost ? BOOST_SPD : 0);
      speed += (wantSpd - speed) * Math.min(1, dt * 3.5);
      distance += speed * dt;
      score = Math.floor(distance) + coinsGot * 10;

      // 生成障碍行（按行驶距离调度）
      distSinceSpawn += speed * dt;
      if (distSinceSpawn >= nextGap) {
        distSinceSpawn = 0;
        spawnRow();
        var gapScale = Math.max(0.62, 1 - (speed - BASE_SPD) / 38);
        nextGap = (13 + Math.random() * 7) * gapScale;
      }

      // 移动并回收障碍
      for (i = obsActive.length - 1; i >= 0; i--) {
        m = obsActive[i];
        m.position.z += speed * dt;
        if (m.position.z > KILL_Z) {
          scene.remove(m); obsPool.push(m);
          obsActive.splice(i, 1);
        }
      }
      // 金币：移动 / 旋转 / 拾取
      var px = player.position.x;
      for (i = coinActive.length - 1; i >= 0; i--) {
        m = coinActive[i];
        m.position.z += speed * dt;
        m.rotation.y += dt * 4;
        m.position.y = 1.05 + Math.sin(t * 3 + m.userData.phase) * 0.12;
        if (m.position.z > KILL_Z) {
          scene.remove(m); coinPool.push(m);
          coinActive.splice(i, 1);
          continue;
        }
        if (Math.abs(m.position.z) < 1.4 && Math.abs(m.position.x - px) < 1.35) {
          coinsGot++;
          popRing(m.position.x, m.position.y, m.position.z);
          sfx.coin();
          scene.remove(m); coinPool.push(m);
          coinActive.splice(i, 1);
        }
      }
      // 碰撞检测
      for (i = 0; i < obsActive.length; i++) {
        m = obsActive[i];
        if (Math.abs(m.position.z) < 1.35 && Math.abs(m.position.x - px) < 1.4) {
          crash();
          break;
        }
      }

      // 玩家移动 / 姿态
      var tx = laneX(targetLane);
      player.position.x += (tx - player.position.x) * Math.min(1, dt * 10);
      runPhase += dt * (6 + speed * 0.35);
      var hop = Math.abs(Math.sin(runPhase)) * 0.22;
      player.position.y = 1.0 + hop;
      player.rotation.z = THREE.MathUtils.clamp((player.position.x - tx) * 0.28, -0.45, 0.45);
    }
    else if (state === 'ready') {
      speed = 6;
      runPhase += dt * 4;
      player.position.y = 1.0 + Math.abs(Math.sin(runPhase)) * 0.1;
      player.rotation.z *= 0.9;
    }
    else { // over
      speed *= Math.exp(-5 * dt);
      overTimer += dt;
      overVy -= 22 * dt;
      player.position.y = Math.max(-2, player.position.y + overVy * dt);
      player.rotation.x -= dt * 9;
      if (overTimer > 0.55 && !overlayShown) {
        overlayShown = true;
        showOverOverlay();
      }
    }

    // 世界滚动量
    var dz = speed * dt;
    crossLines.position.z = (crossLines.position.z + dz) % 4;
    var sp = starGeo.attributes.position.array;
    for (i = 0; i < STARS_N; i++) {
      sp[i*3+2] += dz * 0.55;
      if (sp[i*3+2] > 18) sp[i*3+2] -= 148;
    }
    starGeo.attributes.position.needsUpdate = true;

    // 残影光环
    rings.forEach(function (r) {
      if (r.life < 0) return;
      r.life += dt;
      var k = r.life / 0.35;
      if (k >= 1) { r.life = -1; r.mesh.visible = false; return; }
      var s = 1 + k * 2.6;
      r.mesh.scale.set(s, s, s);
      r.mesh.material.opacity = 1 - k;
    });

    // 影子跟随
    shadow.position.x = player.position.x;
    var sh = 1 / (1 + Math.max(0, player.position.y - 1) * 1.6);
    shadow.scale.set(sh, sh, sh);
    shadow.material.opacity = 0.3 * sh;

    // 相机跟随 + 抖动
    var camTargetX = player.position.x * 0.5;
    camX += (camTargetX - camX) * Math.min(1, dt * 6);
    var sway = (state === 'ready') ? Math.sin(t * 0.6) * 0.7 : 0;
    camera.position.set(camX + sway, 6.2, 10.5);
    if (shake > 0.002) {
      camera.position.x += (Math.random() - 0.5) * shake;
      camera.position.y += (Math.random() - 0.5) * shake * 0.6;
      shake *= Math.exp(-4.5 * dt);
    }
    // 冲刺视效：FOV 拉伸 + 加速指示
    var boostingNow = (state === 'playing' && keyBoost);
    camera.fov += ((boostingNow ? FOV_B : FOV_N) - camera.fov) * Math.min(1, dt * 5);
    camera.updateProjectionMatrix();
    $boost.classList.toggle('on', boostingNow);

    // 音乐能量：冲刺时踩镲/军鼓更亮、贝斯滤波器张开、琶音更响
    musicEnergy = boostingNow ? Math.min(1, musicEnergy + dt * 3)
                              : Math.max(0, musicEnergy - dt * 1.5);

    // 风声引擎：音量平方曲线淡入淡出，滤波频率随能量抬升 + 轻微颤动
    if (windGain) {
      windLvl += ((boostingNow ? 1 : 0) - windLvl) * Math.min(1, dt * 6);
      windGain.gain.value = 0.02 * windLvl * windLvl;
      windFilter.frequency.value =
        320 + 1650 * windLvl + Math.sin(t * 23) * 45 * windLvl;
    }

    camera.lookAt(camX, 1.2, -10);

    // HUD
    if (score !== shownScore) {
      shownScore = score;
      $score.textContent = String(score);
      $coin.textContent = '◆ ' + coinsGot;
    }

    renderer.render(scene, camera);
  }

  showReadyOverlay();
  animate();
})();
</script>
</body>
</html>
