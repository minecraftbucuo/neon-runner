<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#05060f">
<title>霓虹疾驰 · Neon Dash</title>
</head>
<body>

<div id="hud">
  <div class="hud-box">
    <div class="hud-label">SCORE 分数</div>
    <div id="scoreVal">0</div>
    <div id="bestVal">最佳 0</div>
  </div>
  <div class="hud-box" id="coinBox">
    <div class="hud-label">COINS 金币</div>
    <div id="coinVal">◆ 0</div>
  </div>
</div>

<div id="boostTag">»» 加速中 ««</div>

<div id="overlay">
  <div id="title">霓虹疾驰</div>
  <div id="subtitle">N E O N · D A S H</div>
  <div id="msg">在霓虹赛道上飞驰，躲开红色方块<br>吃金币 · 活得更久 · 冲得更快</div>
  <div id="bestLine" class="hidden-el"></div>
  <div class="btn-row">
    <button id="startBtn">开始游戏</button>
    <button id="menuBtn" class="hidden-el">返回菜单</button>
  </div>
  <div id="keysRow">
    <span><kbd>←</kbd><kbd>→</kbd> 换道</span>
    <span><kbd>W</kbd> 冲刺</span>
    <span><kbd>空格</kbd> 开始 / 重开</span>
  </div>
</div>
<div id="hint">按住 W 冲刺 · 空格 开始 / 重开 · Esc 返回菜单（结算时） · 手机左右滑动 · M 音乐开关</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
